services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ushanr
    restart: unless-stopped
    ports:
      - "8007:8007"
    expose:
      - "8007"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - IN_DOCKER=1
    networks:
      - ushspa-network
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8007 --reload
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8007/api/v1/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  ushspa-network:
    external: true
